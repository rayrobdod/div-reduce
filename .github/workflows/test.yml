name: Run Tests
on: [push]
jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        apps: sbt
        jvm: zulu:17
    - name: sbt update
      run: sbt update
    - name: sbt test
      run: sbt test
  plugin_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        apps: sbt
        jvm: zulu:17
    - name: sbt update
      run: sbt update
    - name: sbt publishLocal
      run: sbt publishLocal
    - name: Run plugin tests
      run: sbt scripted
